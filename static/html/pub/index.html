<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>수협 기업 인터넷뱅킹 퍼블리싱 리스트</title>
    <link rel="stylesheet" href="/static/cl/favicon.ico" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Pretendard, sans-serif;
        padding: 40px;
      }

      h1 {
        margin-bottom: 20px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        border: 1px solid #ddd;
        padding: 4px 8px;
        text-align: left;
        font-size: 14px;
      }

      th {
        background: #f5f5f5;
      }

      td.note {
        width: 200px;
        word-break: keep-all;
      }

      tbody tr:hover {
        background: #fafafa;
      }

      a {
        color: #2563eb;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      a:focus {
        color: red;
      }

      .search {
        margin-bottom: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .search .status-wrap span {
        padding: 0 4px;
      }
      .search .status-wrap span::before {
        margin: 0 4px;
      }
      input {
        width: 300px;
        padding: 10px;
      }
      .pub-section {
        margin-bottom: 8px;
      }
      h2 {
        font-size: 15px;
      }
      .status::before { margin-right: 4px; }
      .status.wait {
        color: #101828;
      }
      .status.wait::before {
        content: "";
        display: inline-block;
        border-radius: 100px;
        width: 10px;
        height: 10px;
        background-color: #101828;
      }
      .status.progress {
        color: #039855;
      }
      .status.progress::before {
        content: "";
        display: inline-block;
        border-radius: 100px;
        width: 10px;
        height: 10px;
        background-color: #039855;
      }
      .status.examination {
        color: purple;
      }
      .status.examination::before {
        content: "";
        display: inline-block;
        border-radius: 100px;
        width: 10px;
        height: 10px;
        background-color: purple;
      }
      .status.complete {
        color: #0f62fd;
      }
      .status.complete::before {
        content: "";
        display: inline-block;
        border-radius: 100px;
        width: 10px;
        height: 10px;
        background-color: #0f62fd;
      }
      .status.modify {
        color: #f77316;
      }
      .status.modify::before {
        content: "";
        display: inline-block;
        border-radius: 100px;
        width: 10px;
        height: 10px;
        background-color: #f77316;
      }
      .status.modify-complete {
        color: #b54708;
      }
      .status.modify-complete::before {
        content: "";
        display: inline-block;
        border-radius: 100px;
        width: 10px;
        height: 10px;
        background-color: #b54708;
      }
      .status.urgent {
        color: red;
      }
      .status.urgent::before {
        content: "";
        display: inline-block;
        border-radius: 100px;
        width: 10px;
        height: 10px;
        background-color: red;
      }
      .status.delete {
        color: #a7afbe;
      }
      .status.delete::before {
        content: "";
        display: inline-block;
        border-radius: 100px;
        width: 10px;
        height: 10px;
        background-color: #a7afbe;
      }

      .pub-title {
        margin-bottom: 16px;
        padding-left: 12px;
        border-left: 4px solid #2563eb;
        font-size: 24px;
        font-weight: 700;
      }

      .pub-table {
        width: 100%;
        border-collapse: collapse;
      }

      .pub-table th,
      .pub-table td {
        padding: 12px;
        border: 1px solid #ddd;
      }

      .pub-table th {
        background: #f8f8f8;
      }

     
      #preview-popup {
        display: none;
        position: fixed;
        z-index: 9999;
        width: 600px; 
        height: 400px; 
        border: 1px solid #ddd;
        border-radius: 8px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        background: #fff;
        pointer-events: none;
        overflow: hidden;
      }

      #preview-iframe {
        width: 1920px;
        height: 1280px;
        transform: scale(0.3125);
        transform-origin: top left;
        border: none;
      }
    </style>
  </head>

  <body>
    <h1>수협 기업 인터넷뱅킹 퍼블리싱 리스트</h1>

    <div class="search">
      <input type="text" id="search" placeholder="검색..." />
      <div class="status-wrap">
        <span class="status wait">대기</span>
        <span class="status complete">완료</span>
        <span class="status progress">진행중</span>
        <span class="status examination">검수중</span>
        <span class="status modify">수정중</span>
        <span class="status modify-complete">수정완료</span>
        <span class="status urgent">긴급</span>
        <span class="status delete">삭제</span>
      </div>
    </div>

    <div id="list"></div>

    <div id="preview-popup">
      <iframe id="preview-iframe" src=""></iframe>
    </div>

    <script>
      const depthName = {
        inq: "조회",
        trn: "이체",
        card: "카드",
        fin: "금융상품",
        fin_mfi: "금융상품(수협은행)",
        fns: "금융서비스",
        b2b: "B2B전자결제",
        bmg: "뱅킹관리",
        aug: "인증센터",
        fpd: "공시실",
        cbu: "기업뱅킹 이용가이드",
        bop: "뱅킹업무",
        sil: "간편조회",
        mnd: "메인",
        bni: "은행소개",
        cmn: "공통 팝업 및 화면",
        cst: "고객센터",
        fcp: "금융소비자포털",

        //2depth
        clrs: "대출상환스케줄조회",
        lon: "대출",
        foe: "외환",
        tpr: "신탁",
        act: "계좌이체",
        b2bcpfl: "B2B기업구매자금대출",
        or: "해외송금",
        fce: "외화환전",
        cm: "카드관리",
        mff: "해양수산금융",
        cnb:"수표/어음조회",
        //3depth
        ccpr: "기업카드비밀번호등록",
        ip: "이자납입",
        rop: "원금상환",
        import: "수입",
        fx: "FX",
        dli: "내국신용장조회",
        pom: "상품성 신탁 운용방법 및 소수율 현황",
        cdpst: "연금저축신탁 비교공시",
        dlyt: "지연이체등록내역조회/취소",
        ai: "계좌조회",
        mact: "다계좌이체",
        xfr: "이체",
        sug: "서비스이용안내",
        pc: "구매기업",
        trr: "서식자료실",
        smt: "특정금전신탁",

        //4depth
        od:"개설내역",
        rip: "상환_이자납입",
        pd: "매입명세",
        clha: "대출보유계좌조회",
        oilc: "수입신용장개설",
        ctl: "한도조회",
        ctd: "거래내역조회",
        hai: "휴먼계좌조회",
        rthf: "거래내역파일요청",
        iscd: "매매계약내역조회",
        faq: "FAQ",
        ctd_a_r: "추심인수대상내역(인수/거절)",
        ppf: "구매자금대금결제",

        //5depth
        al: "신청목록",
        eai: "신청목록",
        ob: "신청정보입력",
        ourb: "당행",
        othb: "타행",
        mfura: "자주쓰는송금계좌관리",
        ad: "계좌상세",
        ld: "대출상세",
        rs: "대출상세",
        mor: "최근송금내역",
        general: "총론",
        ff: "영어자금",
        orhistory: "해외송금내역조회",
        siar:"조회입력 및 결과",
        ei:"정보입력",
        iv:"정보확인",
        verificate:"확인",

        //6depth
        di: "상세조회",
        detail: "상세",
        dimt: "국내외화이체",
        guide: "가이드",
        popup: "팝업",
        common: "공통",
        components: "컴포넌트",
        main: "메인",
        sub: "서브",
        cst: "고객센터",

        //7depth
        regist: "등록",
        crcic:"기업송금송금취소_정보확인",
        crrcic:"기업송금송금취소_정보완료",

        interest_situation: "이자상환",
      };

      async function loadList() {
        try {
          const res = await fetch("/static/html/pub/list.json");
          if (!res.ok) throw new Error("list.json을 불러오지 못했습니다.");

          const data = await res.json();
          render(data);

          const input = document.querySelector("#search");
          input.addEventListener("input", () => {
            const keyword = input.value.toLowerCase().trim();

            const filtered = data.filter((item) => {
              const title = (item.title || "").toLowerCase();
              const file = (item.file || "").toLowerCase();
              const worker = (item.worker || "").toLowerCase();
              const note = (item.note || "").toLowerCase();
              const depthsStr = (item.depths || []).join("/").toLowerCase();

              return (
                title.includes(keyword) ||
                file.includes(keyword) ||
                worker.includes(keyword) ||
                note.includes(keyword) ||
                depthsStr.includes(keyword)
              );
            });

            render(filtered);
          });
        } catch (error) {
          console.error("❌ 현황판 데이터 로드 실패:", error);
        }
      }

      function getStatusClass(status) {
        switch (status) {
          case "완료":
            return "complete";
          case "진행중":
            return "progress";
          case "검수중":
            return "examination";
          case "수정중":
            return "modify";
          case "수정완료":
            return "modify-complete";
          case "긴급":
            return "urgent";
          case "삭제":
            return "delete";
          default:
            return "wait";
        }
      }

      function render(data) {
        const container = document.querySelector("#list");
        if (!data.length) {
          container.innerHTML =
            "<p style='padding:20px;'>표시할 데이터가 없습니다.</p>";
          return;
        }

        const maxDepth = Math.max(...data.map((item) => item.depths.length));

        let depthHeader = "";
        for (let i = 0; i < maxDepth; i++) {
          depthHeader += `<th>${i + 1}Depth</th>`;
        }

        const groups = {};
        data.forEach((item) => {
          const key = item.depths[0] || "기타";
          if (!groups[key]) {
            groups[key] = [];
          }
          groups[key].push(item);
        });

        let html = "";

        Object.keys(groups).forEach((group) => {
          groups[group].sort((a, b) => {
            const depthA = a.depths.join("/");
            const depthB = b.depths.join("/");
            return depthA.localeCompare(depthB, "ko");
          });

          html += `
            <section class="pub-section">
                <h2>${depthName[group] || group}</h2>
                <table>
                    <thead>
                        <tr>
                            ${depthHeader}
                            <th>화면명</th>
                            <th>파일명</th>
                            <th>상태</th>
                            <th>수정일</th>
                            <th>보기</th>
                            <th>작업자</th>
                            <th>비고</th>
                        </tr>
                    </thead>
                    <tbody>
          `;

          groups[group].forEach((item) => {
            const status = item.status || "대기";
            const worker = item.worker || "-";
            const note = item.note || "-";

            let depthTd = "";
            for (let i = 0; i < maxDepth; i++) {
              const depth = item.depths[i];
              depthTd += `<td>${depth ? depthName[depth] || depth : "-"}</td>`;
            }

            html += `
                <tr>    
                    ${depthTd}
                    <td>${item.title}</td>
                    <td>${item.file}</td>
                    <td>
                        <span class="status ${getStatusClass(status)}">${status}</span>
                    </td>
                    <td>${item.modified}</td>
                    <td><a href="/static/html/pub/${item.link}" target="_blank" class="preview-link">보기</a></td>
                    <td>${worker}</td>
                    <td class="note">${note}</td>
                </tr>
            `;
          });

          html += `
                    </tbody>
                </table>
            </section>
          `;
        });

        container.innerHTML = html;
      }

      loadList();

      // ==============================================================
      // 🔥 미리보기 이벤트 처리
      // ==============================================================
      const previewPopup = document.getElementById("preview-popup");
      const iframe = document.getElementById("preview-iframe");
      const listContainer = document.querySelector("#list");

      // 1. 링크 위에 마우스가 올라갔을 때 팝업 띄우기
      listContainer.addEventListener("mouseover", (e) => {
        if (e.target.classList.contains("preview-link")) {
          const targetUrl = e.target.getAttribute("href");
          iframe.src = targetUrl;
          previewPopup.style.display = "block";
        }
      });

      // 2. 마우스를 따라다니도록 위치 실시간 계산
      listContainer.addEventListener("mousemove", (e) => {
        if (e.target.classList.contains("preview-link")) {
          const popupWidth = 600;
          const popupHeight = 400;

          let left = e.clientX + 20;
          let top = e.clientY + 20;

          // 팝업이 화면 우측을 넘어가는 경우 좌측으로 표시
          if (left + popupWidth > window.innerWidth) {
            left = e.clientX - popupWidth - 20;
          }
          // 팝업이 화면 하단을 넘어가는 경우 위쪽으로 표시
          if (top + popupHeight > window.innerHeight) {
            top = e.clientY - popupHeight - 20;
          }

          previewPopup.style.left = left + "px";
          previewPopup.style.top = top + "px";
        }
      });

      // 3. 링크에서 마우스가 벗어나면 팝업 숨기기 및 초기화
      listContainer.addEventListener("mouseout", (e) => {
        if (e.target.classList.contains("preview-link")) {
          previewPopup.style.display = "none";
          iframe.src = "";
        }
      });
    </script>
  </body>
</html>
