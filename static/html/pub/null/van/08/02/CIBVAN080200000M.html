<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>수협은행</title>
    <link rel="stylesheet" href="/static/css/reset.css" />
    <link rel="stylesheet" href="/static/css/layout.css" />
    <link rel="stylesheet" href="/static/css/component.css" />
    <link rel="stylesheet" href="/static/css/common.css" />
    <link rel="stylesheet" href="/static/css/van.css" />
  </head>

  <body>
    <div class="popup">
      <div class="van">
        <h2 class="typeH2">출하대금 정산시스템 로그인</h2>
        <div class="term">
          <div class="flex">
            <div class="select-all">
              <input type="checkbox" title="[필수] 약관동의 (필수)" name="authority" id="auth-2" class="form-checkbox size-lg" />
              <label for="auth-2" class="form-label"><span class="typeXlSemibold"> 약관동의 (필수) </span></label>
            </div>
          </div>

          <div class="terms-wrap">
            <div class="form-box-wrap">
              <span class="form-box">
                <input type="checkbox" title="[필수] 파트너뱅킹이용약관 상세보기" name="authority" id="auth-2-1" class="form-checkbox size-lg" />
                <label for="auth-2-1" class="form-label"><span class="color-fg-primary">[필수]</span> 파트너뱅킹이용약관 </label>
              </span>
              <button type="button" title="[필수] 파트너뱅킹이용약관 상세보기" class="btn type-line-neutral size-sm">
                <span class="text">상세보기</span>
              </button>
            </div>

            <div class="form-box-wrap">
              <span class="form-box">
                <input type="checkbox" title="[필수] 전자금융거래기본약관 상세보기" id="auth-2-2" class="form-checkbox size-lg" />
                <label for="auth-2-2" class="form-label"><span class="color-fg-primary">[필수]</span> 전자금융거래기본약관</label>
              </span>
              <button type="button" title="[필수] 전자금융거래기본약관 상세보기" class="btn type-line-neutral size-sm">
                <span class="text">상세보기</span>
              </button>
            </div>
          </div>
        </div>
        <div class="text-wrap">
          <div class="typeLgMedium">위의 약관에 동의하십니까?</div>
          <div class="btn-wrap center lg-bot">
            <button type="button" class="btn type-bg-primary-tint size-xxl">
              <span class="text">동의안함</span>
            </button>
            <button type="button" class="btn type-bg-primary size-xxl">
              <span class="text">동의함</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="/static/js/ui/cib_ui_common.js"></script>
  </body>
</html>
