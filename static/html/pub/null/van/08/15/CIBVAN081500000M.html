<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>수협은행</title>
    <link rel="stylesheet" href="/static/css/reset.css" />
    <link rel="stylesheet" href="/static/css/layout.css" />
    <link rel="stylesheet" href="/static/css/component.css" />
    <link rel="stylesheet" href="/static/css/common.css" />
    <link rel="stylesheet" href="/static/css/van.css" />
  </head>

  <body>
    <div class="popup">
      <div class="van">
        <h2 class="typeH2">출하대금 정산시스템 로그인</h2>
        <div class="box-tab">
          <ul class="list-tab-button type-outline" role="tablist" aria-label="탭 이름">
            <li class="item-tab-button">
              <button type="button" class="btn-tab active" title="선택됨" id="tabBtnTypeOutline01" role="tab" aria-selected="true" aria-controls="tabPanelTypeOutline01">
                <span class="text">출하대금정산금 이체 </span>
              </button>
            </li>
            <li class="item-tab-button">
              <button type="button" class="btn-tab" id="tabBtnTypeOutline02" role="tab" aria-selected="false" aria-controls="tabPanelTypeOutline02">
                <span class="text">거래내역조회 </span>
              </button>
            </li>
          </ul>
          <div class="box-tab-content active" id="tabPanelTypeOutline01" role="tabpanel" aria-labelledby="tabBtnTypeOutline01">
            <h3 class="blind">출하대금정산금 이체 탭</h3>
            <div class="result-box">
              <div class="result-banner">
                <div class="inner-img"></div>
                <div class="result-message">
                  <h4 class="typeH4 color-blueMd">정상적으로 이체를 완료하였습니다.</h4>
                </div>
              </div>
            </div>
            <div class="tbl-area">
              <h4 class="typeH4">출하대금 정산금 이체 정보</h4>
              <table class="table-type01">
                <caption></caption>
                <colgroup>
                  <col style="width: 160px" />
                  <col style="width: 368px" />
                  <col style="width: 160px" />
                  <col style="width: 368px" />
                </colgroup>
                <tbody>
                  <tr>
                    <th scope="row">
                      <span>출금계좌예금주</span>
                    </th>
                    <td colspan="3">
                      <span class="typeMd">홍길동</span>
                    </td>
                  </tr>
                  <tr>
                    <th scope="row">
                      <span>출금계좌번호</span>
                    </th>
                    <td colspan="3">
                      <span class="typeMd">000-000-000000</span>
                    </td>
                  </tr>
                  <tr>
                    <th scope="row">
                      <span>입금계좌예금주</span>
                    </th>
                    <td colspan="3">
                      <span class="typeMd">김철수</span>
                    </td>
                  </tr>

                  <tr>
                    <th scope="row">
                      <span>입금은행</span>
                    </th>
                    <td>
                      <span class="typeMd">KB국민은행</span>
                    </td>
                    <th scope="row">
                      <span>입금의뢰인</span>
                    </th>
                    <td>
                      <span class="typeMd">홍길동</span>
                    </td>
                  </tr>
                  <tr>
                    <th scope="row">
                      <span>입금계좌번호</span>
                    </th>
                    <td>
                      <span class="typeMd">00-000-000000</span>
                    </td>
                    <th scope="row">
                      <span>이체금액</span>
                    </th>
                    <td class="text-right">
                      <span class="typeMd">10,000,000 원</span>
                    </td>
                  </tr>
                  <tr>
                    <th scope="row">
                      <span>송금수수료</span>
                    </th>
                    <td class="text-right">
                      <span class="typeMd">0 원</span>
                    </td>
                    <th scope="row">
                      <span>송금구분</span>
                    </th>
                    <td>
                      <span class="typeMd">정산금액</span>
                    </td>
                  </tr>
                  <tr>
                    <th scope="row">
                      <span>정산형태</span>
                    </th>
                    <td>
                      <span class="typeMd">정산금액</span>
                    </td>
                    <th scope="row">
                      <span>송품장일련번호</span>
                    </th>
                    <td>
                      <span class="typeMd">12345678901</span>
                    </td>
                  </tr>
                  <tr>
                    <th scope="row">
                      <span>현재잔액</span>
                    </th>
                    <td class="text-right">
                      <span class="typeMd">40,000,000 원</span>
                    </td>
                    <th scope="row">
                      <span>현재지급가능잔액</span>
                    </th>
                    <td class="text-right">
                      <span class="typeMd">40,000,000 원</span>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>

            <div class="btn-wrap center lg-bot">
              <button type="button" class="btn type-line-neutral size-xxl">
                <span class="text">인쇄</span>
              </button>
            </div>
          </div>
          <div class="box-tab-content" id="tabPanelTypeOutline02" role="tabpanel" aria-labelledby="tabBtnTypeOutline02" style="display: none">
            <h3 class="blind">거래내역조회 탭</h3>
            Tab 본문 02
          </div>
        </div>
      </div>
    </div>

    <script src="/static/js/ui/cib_ui_common.js"></script>
  </body>
</html>
<script></script>
