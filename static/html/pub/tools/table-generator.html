<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>테이블 HTML 생성기 | 수협은행 퍼블리싱</title>
    <link rel="stylesheet" href="/static/css/reset.css" />
    <link rel="stylesheet" href="/static/css/layout.css" />
    <link rel="stylesheet" href="/static/css/component.css" />
    <link rel="stylesheet" href="/static/css/common.css" />
    <script src="/static/js/ui/cib_ui_common.js"></script>
    <style>
      :root {
        --ink: #17212b;
        --muted: #647382;
        --line: #d8e0e7;
        --panel: #ffffff;
        --wash: #f3f6f8;
        --accent: #087f8c;
        --accent-dark: #075c68;
        --focus: rgba(8, 127, 140, 0.18);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        color: var(--ink);
        background: linear-gradient(135deg, #edf5f4 0%, #f7f4ee 50%, #eef2f6 100%);
        font-family: Pretendard, "맑은 고딕", "Malgun Gothic", sans-serif;
      }
      button, input, select, textarea { font: inherit; }
      button { cursor: pointer; }
      .page { max-width: 1440px; margin: 0 auto; padding: 42px 32px 72px; }
      .masthead { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 28px; }
      .eyebrow { margin: 0 0 8px; color: var(--accent-dark); font-size: 12px; font-weight: 800; letter-spacing: .08em; }
      h1 { margin: 0; font-size: clamp(28px, 4vw, 48px); letter-spacing: -.04em; }
      .intro { max-width: 540px; margin: 10px 0 0; color: var(--muted); line-height: 1.65; }
      .back-link { color: var(--accent-dark); font-size: 14px; font-weight: 700; text-decoration: none; white-space: nowrap; }
      .workspace { display: block; }
      .panel { border: 1px solid rgba(216, 224, 231, .9); border-radius: 10px; background: rgba(255, 255, 255, .92); box-shadow: 0 14px 38px rgba(35, 58, 67, .08); }
      .panel-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 19px 22px; border-bottom: 1px solid var(--line); }
      h2 { margin: 0; font-size: 18px; letter-spacing: -.02em; }
      .panel-body { padding: 22px; }
      .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .field { display: grid; gap: 7px; }
      .field.full { grid-column: 1 / -1; }
      .mode-help { margin: 0 0 20px; padding: 12px 14px; border-left: 3px solid var(--accent); background: #eef7f6; color: var(--muted); font-size: 12px; line-height: 1.55; }
      .is-hidden { display: none; }
      label { color: #40515f; font-size: 13px; font-weight: 800; }
      input, select, textarea { width: 100%; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); outline: none; }
      input, select { min-height: 42px; padding: 9px 11px; }
      textarea { min-height: 140px; padding: 12px; line-height: 1.55; resize: vertical; }
      input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus); }
      .hint { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
      .section-label { display: flex; justify-content: space-between; align-items: baseline; margin: 24px 0 8px; }
      .section-label label { margin: 0; }
      .example { color: var(--muted); font-size: 11px; }
      .grid-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
      .grid-actions { display: flex; gap: 6px; }
      .grid-button { min-height: 32px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 5px; background: #fff; color: var(--ink); font-size: 12px; font-weight: 800; }
      .grid-button:hover { border-color: var(--accent); color: var(--accent-dark); }
      .grid-scroll { overflow: auto; border: 1px solid var(--line); background: #fff; }
      .editor-grid { min-width: 620px; width: 100%; border-collapse: collapse; }
      .editor-grid th, .editor-grid td { min-width: 145px; padding: 6px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
      .editor-grid th { background: #eef7f6; }
      .editor-grid tr:last-child td { border-bottom: 0; }
      .editor-grid th:last-child, .editor-grid td:last-child { border-right: 0; }
      .editor-grid input { min-height: 36px; padding: 7px 9px; border: 1px solid transparent; border-radius: 4px; }
      .editor-grid input:focus { border-color: var(--accent); }
      .grid-index { display: block; margin: 0 0 4px; color: var(--muted); font-size: 10px; text-align: center; }
      .grid-full-row { display: flex; align-items: center; justify-content: center; gap: 4px; margin-top: 5px; color: var(--muted); font-size: 10px; font-weight: 400; white-space: nowrap; }
      .grid-full-row input { width: auto; min-height: auto; }
      .grid-delete { display: block; margin: 4px auto 0; border: 0; background: transparent; color: #a14646; font-size: 11px; }
      .context-menu { position: fixed; z-index: 10; display: none; min-width: 130px; padding: 5px; border: 1px solid var(--line); border-radius: 6px; background: #fff; box-shadow: 0 8px 24px rgba(35, 58, 67, .16); }
      .context-menu.is-open { display: grid; }
      .context-menu button { padding: 8px 10px; border: 0; background: transparent; color: var(--ink); text-align: left; font-size: 12px; }
      .context-menu button:hover { background: #eef7f6; color: var(--accent-dark); }
      .cell-options { display: none; gap: 7px; padding: 8px; border-top: 1px solid var(--line); }
      .cell-options.is-open { display: grid; }
      .cell-options label { font-size: 11px; }
      .cell-options input, .cell-options select, .cell-options textarea { min-height: 30px; padding: 4px 6px; font-size: 11px; }
      .cell-options textarea { min-height: 54px; resize: vertical; }
      .button-stack { display: grid; gap: 4px; margin: 2px 0 4px; }
      .button-stack-item { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 11px; }
      .button-stack-item button { overflow: hidden; flex: 1; padding: 4px 6px; white-space: nowrap; text-overflow: ellipsis; }
      .button-stack-item .remove-button { flex: none; padding: 0 4px; color: #a14646; font-weight: 800; }
      .grid-component-stack { display: grid; gap: 4px; margin-top: 5px; }
      .grid-component-stack .grid-stack-button { position: relative; padding: 5px 22px 5px 7px; border: 1px solid #cfd9df; border-radius: 4px; background: #fff; color: var(--ink); font-size: 11px; text-align: left; }
      .grid-component-stack .grid-stack-remove { position: absolute; top: 2px; right: 3px; padding: 0 3px; border: 0; background: transparent; color: #a14646; font-weight: 800; }
      .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
      .btn { min-height: 40px; padding: 8px 15px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); font-weight: 800; }
      .btn.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
      .btn.primary:hover { background: var(--accent-dark); }
      .btn:hover { border-color: var(--accent); }
      .output-panel { margin-top: 20px; }
      .output-actions { display: flex; gap: 7px; }
      .status { min-height: 18px; margin: 16px 0 0; color: var(--accent-dark); font-size: 12px; font-weight: 700; }
      .preview { overflow: auto; min-height: 164px; padding: 18px; border: 1px solid var(--line); background: #fff; }
      pre { overflow: auto; max-height: 520px; margin: 0; padding: 18px; border-radius: 6px; background: #17212b; color: #e6f0ef; font: 12px/1.65 Consolas, "맑은 고딕", monospace; white-space: pre-wrap; word-break: break-word; }
      
      /* 컨텍스트 메뉴 내 옵션 그룹 가시성 제어 */
      .option-group { display: none; }
      .option-group.is-visible { display: contents; }
      
      @media (max-width: 900px) {
        .page { padding: 28px 16px 48px; }
        .masthead { align-items: start; flex-direction: column; }
        .output-panel { margin-top: 16px; }
      }
      @media (max-width: 520px) {
        .field-grid { grid-template-columns: 1fr; }
        .field.full { grid-column: auto; }
        .output-actions { flex-wrap: wrap; justify-content: end; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="masthead">
        <div>
          <p class="eyebrow">PUBLISHING TOOL / TABLE</p>
          <h1>테이블 HTML 생성기</h1>
          <p class="intro">그리드에 데이터를 입력하면 프로젝트 테이블 마크업과 미리보기를 함께 생성합니다.</p>
        </div>
        <a class="back-link" href="../components/guide.html#contentTable">테이블 가이드로 돌아가기</a>
      </header>

      <div class="workspace">
        <section class="panel" aria-labelledby="form-title">
          <div class="panel-header"><h2 id="form-title">테이블 설정</h2></div>
          <div class="panel-body">
            <div class="field-grid">
              <div class="field">
                <label for="table-class">테이블 클래스</label>
                <select id="table-class">
                  <option value="table-type01">table-type01</option>
                  <option value="table-type03">table-type03</option>
                </select>
              </div>
            </div>

            <div class="list-fields">
              <div class="grid-toolbar">
                <label>데이터 그리드</label>
                <div class="grid-actions">
                  <button class="grid-button" id="add-column" type="button">+ 열 추가</button>
                  <button class="grid-button" id="add-row" type="button">+ 행 추가</button>
                </div>
              </div>
              <div class="grid-scroll">
                <table class="editor-grid">
                  <thead id="grid-head"></thead>
                  <tbody id="grid-body"></tbody>
                </table>
              </div>
              <p class="hint">셀을 직접 수정하세요. table-type01은 행 오른쪽의 `+ 쌍 추가`로 해당 행만 두 쌍으로 확장할 수 있습니다.</p>
            </div>

            <div class="actions">
              <button class="btn" id="reset-button" type="button">초기화</button>
              <button class="btn primary" id="generate-button" type="button">HTML 생성</button>
            </div>
          </div>
        </section>

        <section class="panel output-panel" aria-labelledby="output-title">
          <div class="panel-header">
            <h2 id="output-title">결과</h2>
            <div class="output-actions">
              <button class="btn" id="copy-button" type="button">HTML 복사</button>
              <button class="btn" id="download-button" type="button">파일 저장</button>
            </div>
          </div>
          <div class="panel-body">
            <div class="preview" id="preview" aria-live="polite"></div>
            <p class="status" id="status" role="status"></p>
            <div class="section-label"><label for="output">생성된 HTML</label></div>
            <pre id="output"></pre>
          </div>
        </section>
      </div>
    </main>

    <div class="context-menu" id="cell-context-menu" role="menu">
      <button type="button" data-cell-type="text" role="menuitem">텍스트</button>
      <button type="button" data-cell-type="input" role="menuitem">텍스트 input</button>
      <button type="button" data-cell-type="combo" role="menuitem">콤보박스</button>
      <button type="button" data-cell-type="button" role="menuitem">버튼</button>
      
      <div class="cell-options" id="cell-options">
        
        <!-- [1] 버튼 전용 옵션 -->
        <div class="option-group" data-show="button">
          <label for="btn-size">버튼 사이즈</label>
          <select id="btn-size">
            <option value="size-sm">Small</option>
            <option value="size-md" selected>Medium</option>
            <option value="size-lg">Large</option>
            <option value="size-xl">X-large</option>
            <option value="size-xxl">XX-large</option>
          </select>
      
          <label for="btn-style">버튼 타입</label>
          <select id="btn-style">
            <option value="bg" selected>Background type</option>
            <option value="outline">Outline type</option>
            <option value="ghost">Ghost type</option>
            <option value="round">Outline Round type</option>
          </select>
      
          <label for="btn-color">버튼 색상</label>
          <select id="btn-color">
            <!-- JS에서 btn-style 선택에 따라 동적으로 채워집니다 -->
          </select>
      
          <label for="btn-text">버튼 텍스트</label>
          <div class="button-stack">
            <div class="button-stack-item">
              <input id="btn-text" type="text" placeholder="버튼명을 입력하세요" />
              <button type="button" class="grid-button" id="add-button-item">확인</button>
            </div>
            <div id="button-items"></div>
          </div>
        </div>
      
        <!-- [2] 콤보박스 전용 옵션 -->
        <div class="option-group" data-show="combo">
          <label for="combo-size">콤보박스 사이즈</label>
          <select id="combo-size">
            <option value="size-md">Medium</option>
            <option value="size-lg" selected>Large</option>
          </select>
      
          <label for="combo-list">옵션 리스트 (줄마다 1개)</label>
          <textarea id="combo-list" placeholder="항목1&#10;항목2"></textarea>
        </div>
      
        <!-- [3] 텍스트 필드(input) 전용 옵션 -->
        <div class="option-group" data-show="input">
          <label for="input-value">Value (초기값)</label>
          <input id="input-value" type="text" />
      
          <label for="input-placeholder">Placeholder</label>
          <input id="input-placeholder" type="text" />
      
          <label for="input-title">Title 속성 (접근성)</label>
          <input id="input-title" type="text" placeholder="입력칸 설명을 적어주세요" />
      
          <label style="display: flex; align-items: center; gap: 6px; flex-direction: row; margin-top: 8px;">
            <input type="checkbox" id="input-readonly" style="width: auto; min-height: auto;" />
            Readonly 적용
          </label>
        </div>
      
        <button type="button" class="grid-button" id="apply-options" style="margin-top: 10px;">옵션 적용</button>
      </div>
    </div>

    <script>
      const defaults = {
        tableClass: "table-type01"
      };
      const fields = {
        tableClass: document.querySelector("#table-class")
      };
      const preview = document.querySelector("#preview");
      const output = document.querySelector("#output");
      const status = document.querySelector("#status");
      const cellContextMenu = document.querySelector("#cell-context-menu");
      let contextCell = null;
      let contextPosition = null;
      
      let gridData = {
        headers: [""],
        rows: [[""]],
        fullRows: [false],
        cellTypes: [["text"]],
        cellOptions: [[{ buttons: [] }]]
      };
      let type01Groups = [[0]];

      // 버튼 타입별 색상 클래스 매핑
      const buttonColors = {
        bg: [
          { val: 'type-bg-primary', label: 'Primary' },
          { val: 'type-bg-neutral', label: 'Neutral' },
          { val: 'type-bg-neutral-tint', label: 'Neutral-tint' },
          { val: 'type-bg-primary-tint', label: 'Primary-tint' },
          { val: 'type-bg-error', label: 'Error' }
        ],
        outline: [
          { val: 'type-line-primary', label: 'Primary' },
          { val: 'type-line-secondary', label: 'Secondary' },
          { val: 'type-line-neutral', label: 'Neutral' }
        ],
        ghost: [
          { val: 'type-ghost-primary', label: 'Primary' },
          { val: 'type-ghost-neutral', label: 'Neutral' },
          { val: 'type-ghost-invert', label: 'Invert' },
          { val: 'type-ghost-error', label: 'Error' }
        ],
        round: [
          { val: 'type-round-primary', label: 'Primary' },
          { val: 'type-round-secondary', label: 'Secondary' },
          { val: 'type-round-error', label: 'Error' }
        ]
      };

      function renderButtonColors(typeValue, selectedColor = null) {
        const colorSelect = document.querySelector('#btn-color');
        const options = buttonColors[typeValue] || buttonColors.bg;
        colorSelect.innerHTML = options.map(opt => 
          `<option value="${opt.val}" ${opt.val === selectedColor ? 'selected' : ''}>${opt.label}</option>`
        ).join('');
      }

      document.querySelector('#btn-style').addEventListener('change', (e) => {
        renderButtonColors(e.target.value);
      });

      function escapeHtml(value) {
        return String(value).replace(/[&<>\"]/g, character => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[character]));
      }

      function parseColumns() {
        return gridData.headers.map(label => ({ label, width: "auto", align: "left" }));
      }

      function parseRows(columnCount) {
        return gridData.rows.map(row => Array.from({ length: columnCount }, (_, index) => row[index] || ""));
      }

      function getCellType(rowIndex, columnIndex) {
        return gridData.cellTypes[rowIndex]?.[columnIndex] || "text";
      }

      function getCellOptions(rowIndex, columnIndex) {
        return gridData.cellOptions[rowIndex]?.[columnIndex] || {};
      }

      function renderButtonItems(items = []) {
        document.querySelector("#button-items").innerHTML = items.map((item, index) => `<div class="button-stack-item"><span>${escapeHtml(item)}</span><button type="button" class="remove-button" data-remove-option-button="${index}">x</button></div>`).join("");
      }

      function makeGridComponentStack(rowIndex, columnIndex) {
        const type = getCellType(rowIndex, columnIndex);
        const options = getCellOptions(rowIndex, columnIndex);
        if (type !== "button") return "";
        const items = options.buttons || (options.text ? options.text.split("\n").filter(Boolean) : []);
        return `<div class="grid-component-stack">${items.map((item, index) => `<span class="grid-stack-button">${escapeHtml(item)}<button type="button" class="grid-stack-remove" data-delete-button-row="${rowIndex}" data-delete-button-column="${columnIndex}" data-delete-button-index="${index}" aria-label="${escapeHtml(item)} 버튼 삭제">x</button></span>`).join("")}</div>`;
      }

      function resetType01Groups() {
        type01Groups = gridData.headers.map((_, index) => [index]);
      }

      function renderGrid() {
        if (fields.tableClass.value === "table-type01") {
          gridData.rows = [gridData.rows[0] || gridData.headers.map(() => "")];
          const pairRows = [];
          type01Groups.forEach(group => {
            const cells = [];
            group.forEach(headerIndex => {
              if (headerIndex < gridData.headers.length) {
                cells.push(`<th><input type="text" data-header-index="${headerIndex}" value="${escapeHtml(gridData.headers[headerIndex])}"><button class="grid-delete" data-delete-column="${headerIndex}" type="button">항목 삭제</button></th><td><input type="text" data-row-index="0" data-column-index="${headerIndex}" data-cell-type="${getCellType(0, headerIndex)}" value="${escapeHtml(gridData.rows[0][headerIndex] || "")}">${makeGridComponentStack(0, headerIndex)}</td>`);
              } else {
                cells.push("<td colspan=\"2\"></td>");
              }
            });
            const addPair = group.length < 2 ? `<td class="grid-row-action"><button class="grid-button" data-add-pair="${group[0]}" type="button">+ 쌍 추가</button></td>` : "";
            pairRows.push(`<tr>${cells.join("")}${addPair}</tr>`);
          });
          document.querySelector("#grid-head").innerHTML = "";
          document.querySelector("#grid-body").innerHTML = pairRows.join("") || `<tr><td colspan="2">항목을 추가해주세요.</td></tr>`;
          document.querySelector("#add-column").style.display = "none";
          document.querySelector("#add-row").style.display = "inline-block";
          document.querySelector("#add-row").textContent = "+ 항목 추가";
          return;
        }
        document.querySelector("#add-column").style.display = "inline-block";
        document.querySelector("#add-row").style.display = "inline-block";
        document.querySelector("#add-row").textContent = "+ 행 추가";
        document.querySelector("#grid-head").innerHTML = `<tr>${gridData.headers.map((header, index) => `<th><span class="grid-index">열 ${index + 1}</span><input type="text" data-header-index="${index}" value="${escapeHtml(header)}"><button class="grid-delete" data-delete-column="${index}" type="button">열 삭제</button></th>`).join("")}</tr>`;
        document.querySelector("#grid-body").innerHTML = gridData.rows.map((row, rowIndex) => `<tr>${gridData.headers.map((_, columnIndex) => `<td><input type="text" data-row-index="${rowIndex}" data-column-index="${columnIndex}" data-cell-type="${getCellType(rowIndex, columnIndex)}" value="${escapeHtml(row[columnIndex] || "")}">${makeGridComponentStack(rowIndex, columnIndex)}</td>`).join("")}<td><button class="grid-delete" data-delete-row="${rowIndex}" type="button">행 삭제</button></td></tr>`).join("") || `<tr><td colspan="${gridData.headers.length + 1}">행을 추가해주세요.</td></tr>`;
      }

      function readGrid() {
        document.querySelectorAll("[data-header-index]").forEach(input => { gridData.headers[Number(input.dataset.headerIndex)] = input.value; });
        document.querySelectorAll("[data-row-index]").forEach(input => {
          const rowIndex = Number(input.dataset.rowIndex);
          const columnIndex = Number(input.dataset.columnIndex);
          gridData.rows[rowIndex][columnIndex] = input.value;
          gridData.cellTypes[rowIndex][columnIndex] = input.dataset.cellType || "text";
        });
        document.querySelectorAll("[data-full-row-index]").forEach(input => { gridData.fullRows[Number(input.dataset.fullRowIndex)] = input.checked; });
      }

      function makeCell(value, column, tag) {
        const className = column.align === "left" ? "" : ` class="text-${column.align}"`;
        const content = tag === "th" ? escapeHtml(value) : `<span class="typeMd">${escapeHtml(value)}</span>`;
        return `<${tag}${className}>${content}</${tag}>`;
      }

      function makeDataCell(value, column, type, rowIndex = 0, columnIndex = 0) {
        const className = column.align === "left" ? "" : ` class="text-${column.align}"`;
        const safeValue = escapeHtml(value);
        const options = getCellOptions(rowIndex, columnIndex);
        const cellId = `table-cell-${rowIndex}-${columnIndex}`;
        
        let content = `<span class="typeMd">${safeValue}</span>`;
        
        if (type === "combo") {
          const optionItems = String(options.list || "").split("\n").map(item => item.trim()).filter(Boolean);
          const listItems = optionItems.length ? optionItems : [value || "선택해주세요"];
          // 콤보박스는 options.size 사용 (size-md, size-lg)
          content = `<div class="box-select ${options.size || "size-lg"}"><button type="button" class="select ${options.size || "size-lg"}" id="${cellId}-combo" role="combobox" aria-expanded="false" aria-haspopup="listbox" aria-controls="${cellId}-list" aria-label="${escapeHtml(column.label)}"><span class="text">${safeValue || "선택해주세요"}</span><span class="blind">목록 열기</span></button><div class="box-list-select" id="${cellId}-list"><ul class="list-select" role="listbox" aria-label="${escapeHtml(column.label)} 선택 항목">${listItems.map((item, index) => `<li class="item-select" role="option" aria-selected="${index === 0 ? "true" : "false"}"><button type="button" class="btn-item-select">${escapeHtml(item)}</button></li>`).join("")}</ul></div></div>`;
        } else if (type === "button") {
          const buttonItems = options.buttons?.length ? options.buttons : String(value || "버튼").split("\n").map(item => item.trim()).filter(Boolean);
          content = `<div class="tbl-flex">${buttonItems.map((item, index) => `<button type="button" class="btn ${options.color || "type-bg-primary"} ${options.size || "size-md"}" aria-label="${escapeHtml(item)}"><span class="text">${escapeHtml(item)}</span></button>`).join("")}</div>`;
        } else if (type === "input") {
          // 텍스트 필드 렌더링 임시 적용 (가이드 태그 전달 시 수정될 부분)
          const titleAttr = options.title ? ` title="${escapeHtml(options.title)}"` : "";
          const readonlyAttr = options.readonly ? " readonly" : "";
          const placeholder = options.placeholder ? ` placeholder="${escapeHtml(options.placeholder)}"` : "";
          const val = options.value ? ` value="${escapeHtml(options.value)}"` : ` value="${safeValue}"`;
          content = `<input type="text" class="input size-lg" id="${cellId}-input" aria-label="${escapeHtml(column.label)}"${placeholder}${titleAttr}${readonlyAttr}${val}>`;
        }
        return `<td${className}>${content}</td>`;
      }

      function makeAutoCaption(labels) {
        const uniqueLabels = [...new Set(labels.map(label => label.replace(/\s+/g, " ").trim()).filter(Boolean))];
        return `${escapeHtml(uniqueLabels.join(", "))}에 대한 구성 테이블입니다.`;
      }

      function generate() {
        readGrid();
        const columns = parseColumns();
        if (!columns.length || !columns[0].label.trim()) {
          status.textContent = "열 정보를 한 개 이상 입력하세요.";
          preview.innerHTML = "";
          output.textContent = "";
          return;
        }
        const colgroup = columns.map(column => `    <col style="width: ${escapeHtml(column.width)}" />`).join("\n");
        const caption = makeAutoCaption(columns.map(column => column.label));
        const rows = parseRows(columns.length);
        if (fields.tableClass.value === "table-type01") {
          const verticalBody = rows.flatMap(row => {
            const pairs = [];
            type01Groups.forEach(group => {
              const firstIndex = group[0];
              const firstLabel = makeCell(columns[firstIndex].label, columns[firstIndex], "th").replace("<th", '<th scope="row"');
              if (group.length === 2) {
                const secondIndex = group[1];
                const secondLabel = makeCell(columns[secondIndex].label, columns[secondIndex], "th").replace("<th", '<th scope="row"');
                pairs.push(`    <tr>\n      ${firstLabel}\n      ${makeDataCell(row[firstIndex], columns[firstIndex], getCellType(0, firstIndex), 0, firstIndex)}\n      ${secondLabel}\n      ${makeDataCell(row[secondIndex], columns[secondIndex], getCellType(0, secondIndex), 0, secondIndex)}\n    </tr>`);
              } else {
                const valueCell = makeDataCell(row[firstIndex], columns[firstIndex], getCellType(0, firstIndex), 0, firstIndex).replace("<td", '<td colspan="3"');
                pairs.push(`    <tr>\n      ${firstLabel}\n      ${valueCell}\n    </tr>`);
              }
            });
            return pairs;
          }).join("\n");
          const verticalColgroup = type01Groups.some(group => group.length === 2)
            ? `    <col style="width: 160px" />\n    <col style="width: 368px" />\n    <col style="width: 160px" />\n    <col style="width: 368px" />`
            : `    <col style="width: 160px" />\n    <col style="width: auto" />`;
          const verticalHtml = `<div class="tbl-area">\n  <table class="table-type01">\n    <caption>\n      ${caption}\n    </caption>\n    <colgroup>\n${verticalColgroup}\n    </colgroup>\n    <tbody>\n${verticalBody}\n    </tbody>\n  </table>\n</div>`;
          output.textContent = verticalHtml;
          preview.innerHTML = verticalHtml;
          if (window.initDynamicUI) window.initDynamicUI(preview);
          status.textContent = `${columns.length}개 항목의 세로형 테이블을 생성했습니다.`;
          return;
        }
        const headers = columns.map(column => `      ${makeCell(column.label, column, "th").replace("<th", '<th scope="col"')}`).join("\n");
        const body = rows.length ? rows.map((row, rowIndex) => `    <tr>\n${row.map((value, index) => `      ${makeDataCell(value, columns[index], getCellType(rowIndex, index), rowIndex, index)}`).join("\n")}\n    </tr>`).join("\n") : "    <tr>\n" + columns.map(column => `      ${makeCell("", column, "td")}`).join("\n") + "\n    </tr>";
        const html = `<table class="${escapeHtml(fields.tableClass.value)}">\n  <caption>\n    ${caption}\n  </caption>\n  <colgroup>\n${colgroup}\n  </colgroup>\n  <thead>\n    <tr>\n${headers}\n    </tr>\n  </thead>\n  <tbody>\n${body}\n  </tbody>\n</table>`;
        output.textContent = html;
        preview.innerHTML = html;
        if (window.initDynamicUI) window.initDynamicUI(preview);
        status.textContent = `${columns.length}개 열, ${rows.length || 1}개 행을 생성했습니다.`;
      }

      function reset() {
        fields.tableClass.value = defaults.tableClass;
        gridData = {
          headers: [""],
          rows: [[""]],
          fullRows: [false],
          cellTypes: [["text"]],
          cellOptions: [[{ buttons: [] }]]
        };
        resetType01Groups();
        renderGrid();
        generate();
      }

      document.querySelector("#generate-button").addEventListener("click", generate);
      document.querySelector("#reset-button").addEventListener("click", reset);
      Object.values(fields).forEach(field => field.addEventListener("input", generate));
      fields.tableClass.addEventListener("change", () => {
        if (fields.tableClass.value === "table-type01") {
          gridData.rows = [gridData.rows[0] || gridData.headers.map(() => "")];
          resetType01Groups();
        }
        renderGrid();
        generate();
      });
      document.querySelector("#grid-head").addEventListener("input", event => {
        if (event.target.matches("[data-header-index]")) generate();
      });
      document.querySelector("#grid-body").addEventListener("input", event => {
        if (event.target.matches("[data-row-index]")) generate();
      });
      document.querySelector("#grid-body").addEventListener("change", event => {
        if (!event.target.matches("[data-full-row-index]")) return;
        readGrid();
        renderGrid();
        generate();
      });
      document.querySelector("#add-column").addEventListener("click", () => {
        readGrid();
        if (fields.tableClass.value === "table-type01") return;
        gridData.headers.push(`열 ${gridData.headers.length + 1}`);
        gridData.rows.forEach(row => row.push(""));
        gridData.fullRows.push(false);
        gridData.cellTypes.forEach(row => row.push("text"));
        gridData.cellOptions.forEach(row => row.push({ buttons: [] }));
        renderGrid();
        generate();
      });
      document.querySelector("#add-row").addEventListener("click", () => {
        readGrid();
        if (fields.tableClass.value === "table-type01") {
          gridData.headers.push(`항목 ${gridData.headers.length + 1}`);
          gridData.rows[0].push("");
          gridData.fullRows.push(false);
          gridData.cellTypes[0].push("text");
          gridData.cellOptions[0].push({ buttons: [] });
          type01Groups.push([gridData.headers.length - 1]);
          renderGrid();
          generate();
          return;
        }
        gridData.rows.push(gridData.headers.map(() => ""));
        gridData.cellTypes.push(gridData.headers.map(() => "text"));
        gridData.cellOptions.push(gridData.headers.map(() => ({ buttons: [] })));
        renderGrid();
        generate();
      });
      document.querySelector(".grid-scroll").addEventListener("click", event => {
        const removeButton = event.target.closest("[data-delete-button-row]");
        if (removeButton) {
          const options = getCellOptions(Number(removeButton.dataset.deleteButtonRow), Number(removeButton.dataset.deleteButtonColumn));
          options.buttons.splice(Number(removeButton.dataset.deleteButtonIndex), 1);
          renderGrid();
          generate();
          return;
        }
        const button = event.target.closest("[data-delete-column]");
        if (!button || gridData.headers.length <= 1) return;
        readGrid();
        const index = Number(button.dataset.deleteColumn);
        gridData.headers.splice(index, 1);
        gridData.rows.forEach(row => row.splice(index, 1));
        gridData.fullRows.splice(index, 1);
        gridData.cellTypes.forEach(row => row.splice(index, 1));
        gridData.cellOptions.forEach(row => row.splice(index, 1));
        type01Groups = type01Groups.map(group => group.filter(item => item !== index).map(item => item > index ? item - 1 : item)).filter(group => group.length);
        renderGrid();
        generate();
      });
      document.querySelector("#grid-body").addEventListener("click", event => {
        const addPairButton = event.target.closest("[data-add-pair]");
        if (addPairButton) {
          readGrid();
          const group = type01Groups.find(item => item[0] === Number(addPairButton.dataset.addPair));
          const newIndex = gridData.headers.length;
          if (group && group.length < 2) {
            gridData.headers.push("");
            gridData.rows[0].push("");
            gridData.fullRows.push(false);
            gridData.cellTypes[0].push("text");
            gridData.cellOptions[0].push({ buttons: [] });
            group.push(newIndex);
            renderGrid();
            generate();
          }
          return;
        }
        const button = event.target.closest("[data-delete-row]");
        if (!button) return;
        readGrid();
        gridData.rows.splice(Number(button.dataset.deleteRow), 1);
        renderGrid();
        generate();
      });

      // 옵션 노출 제어 헬퍼 함수
      function updateOptionsVisibility(selectedType) {
        document.querySelectorAll(".option-group").forEach(group => {
          const showTypes = group.dataset.show.split(" ");
          if (showTypes.includes(selectedType)) {
            group.classList.add("is-visible");
          } else {
            group.classList.remove("is-visible");
          }
        });
      }

      document.querySelector(".grid-scroll").addEventListener("contextmenu", event => {
        const cell = event.target.closest("[data-row-index][data-column-index]");
        if (!cell) return;
        event.preventDefault();
        contextCell = cell;
        contextPosition = { rowIndex: Number(cell.dataset.rowIndex), columnIndex: Number(cell.dataset.columnIndex) };
        
        document.querySelector("#cell-options").classList.remove("is-open");
        cellContextMenu.style.left = `${Math.min(event.clientX, window.innerWidth - 145)}px`;
        cellContextMenu.style.top = `${Math.min(event.clientY, window.innerHeight - 145)}px`;
        cellContextMenu.classList.add("is-open");
      });

      cellContextMenu.addEventListener("click", event => {
        const button = event.target.closest("[data-cell-type]");
        if (!button || !contextCell) return;
        const type = button.dataset.cellType;

        if (type === "button" || type === "combo" || type === "input") {
          contextCell.dataset.cellType = type;
          const options = getCellOptions(Number(contextCell.dataset.rowIndex), Number(contextCell.dataset.columnIndex));
          
          if (type === "button") {
            document.querySelector("#btn-size").value = options.size || "size-md";
            document.querySelector("#btn-style").value = options.style || "bg";
            renderButtonColors(options.style || "bg", options.color);
            renderButtonItems(options.buttons || []);
          } else if (type === "combo") {
            document.querySelector("#combo-size").value = options.size || "size-lg";
            document.querySelector("#combo-list").value = options.list || "";
          } else if (type === "input") {
            document.querySelector("#input-value").value = options.value || "";
            document.querySelector("#input-placeholder").value = options.placeholder || "";
            document.querySelector("#input-title").value = options.title || "";
            document.querySelector("#input-readonly").checked = options.readonly || false;
          }
          
          updateOptionsVisibility(type);
          document.querySelector("#cell-options").classList.add("is-open");
          return;
        }
        
        contextCell.dataset.cellType = type;
        readGrid();
        generate();
        cellContextMenu.classList.remove("is-open");
        contextCell = null;
      });

      document.querySelector("#apply-options").addEventListener("click", () => {
        if (!contextCell) return;
        const rowIndex = Number(contextCell.dataset.rowIndex);
        const columnIndex = Number(contextCell.dataset.columnIndex);
        const type = contextCell.dataset.cellType;
        const existingButtons = getCellOptions(rowIndex, columnIndex).buttons || [];
        
        const newOptions = {};
        
        if (type === "button") {
          newOptions.size = document.querySelector("#btn-size").value;
          newOptions.style = document.querySelector("#btn-style").value;
          newOptions.color = document.querySelector("#btn-color").value;
          newOptions.buttons = existingButtons;
        } else if (type === "combo") {
          newOptions.size = document.querySelector("#combo-size").value;
          newOptions.list = document.querySelector("#combo-list").value;
        } else if (type === "input") {
          newOptions.value = document.querySelector("#input-value").value;
          newOptions.placeholder = document.querySelector("#input-placeholder").value;
          newOptions.title = document.querySelector("#input-title").value;
          newOptions.readonly = document.querySelector("#input-readonly").checked;
          newOptions.size = "size-lg"; // 고정
        }
        
        gridData.cellOptions[rowIndex][columnIndex] = newOptions;
        
        readGrid();
        generate();
        cellContextMenu.classList.remove("is-open");
        contextCell = null;
      });

      document.querySelector("#add-button-item").addEventListener("click", () => {
        if (!contextPosition) return;
        const { rowIndex, columnIndex } = contextPosition;
        const text = document.querySelector("#btn-text").value.trim();
        if (!text) return;
        const options = getCellOptions(rowIndex, columnIndex);
        options.buttons = options.buttons || [];
        options.buttons.push(text);
        document.querySelector("#btn-text").value = "";
        renderButtonItems(options.buttons);
        renderGrid();
        generate();
      });

      document.querySelector("#button-items").addEventListener("click", event => {
        const button = event.target.closest("[data-remove-option-button]");
        if (!button || !contextPosition) return;
        const options = getCellOptions(contextPosition.rowIndex, contextPosition.columnIndex);
        options.buttons.splice(Number(button.dataset.removeOptionButton), 1);
        renderButtonItems(options.buttons);
        renderGrid();
        generate();
      });

      document.addEventListener("click", event => {
        if (!event.target.closest("#cell-context-menu")) cellContextMenu.classList.remove("is-open");
      });
      document.addEventListener("keydown", event => {
        if (event.key === "Escape") cellContextMenu.classList.remove("is-open");
      });
      document.querySelector("#copy-button").addEventListener("click", async () => {
        if (!output.textContent) return;
        await navigator.clipboard.writeText(output.textContent);
        status.textContent = "HTML을 클립보드에 복사했습니다.";
      });
      document.querySelector("#download-button").addEventListener("click", () => {
        const blob = new Blob([output.textContent], { type: "text/html;charset=utf-8" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "table.html";
        link.click();
        URL.revokeObjectURL(link.href);
        status.textContent = "table.html 파일을 저장했습니다.";
      });
      
      renderGrid();
      generate();
    </script>
  </body>
</html>
